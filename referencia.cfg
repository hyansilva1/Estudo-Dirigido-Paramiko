cat << 'EOF' > referencia.cfg
ntp_server=10.0.0.50
snmp_community=privada-forte
logging_level=info
EOF

for u in r1 r2 r3; do
  sudo sed -i 's/^ntp_server=.*/ntp_server=10.0.0.50/' /home/$u/dispositivo.cfg
  sudo sed -i 's/^snmp_community=.*/snmp_community=privada-forte/' /home/$u/dispositivo.cfg
done
sudo sed -i 's/^snmp_community=.*/snmp_community=public/' /home/r2/dispositivo.cfg